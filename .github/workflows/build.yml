name: Build Gan Music Player APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/gan/musicplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GanMusicPlayer"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gan.musicplayer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gan.musicplayer'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Gan Music Player">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Gan Music Player"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:padding="10dp"/>

              <ListView
                  android:id="@+id/songList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>

              <TextView
                  android:id="@+id/nowPlaying"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="কোনো গান চলছে না"
                  android:textSize="18sp"
                  android:padding="12dp"/>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/gan/musicplayer/MainActivity.java <<'EOF'
          package com.gan.musicplayer;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.database.Cursor;
          import android.content.pm.PackageManager;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.ListView;
          import android.widget.TextView;

          import java.util.ArrayList;

          public class MainActivity extends Activity {

              ListView songList;
              TextView nowPlaying;
              ArrayList<String> names = new ArrayList<>();
              ArrayList<String> paths = new ArrayList<>();
              MediaPlayer player;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  songList = findViewById(R.id.songList);
                  nowPlaying = findViewById(R.id.nowPlaying);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(
                          new String[]{Manifest.permission.READ_MEDIA_AUDIO}, 10);
                  } else {
                      requestPermissions(
                          new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 10);
                  }

                  loadSongs();

                  songList.setOnItemClickListener((parent, view, position, id) -> {
                      playSong(position);
                  });
              }

              void loadSongs() {
                  String[] projection = {
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME
                  };

                  Cursor cursor = getContentResolver().query(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                      projection,
                      MediaStore.Audio.Media.IS_MUSIC + " != 0",
                      null,
                      MediaStore.Audio.Media.DISPLAY_NAME + " ASC"
                  );

                  if (cursor != null) {
                      int nameIndex = cursor.getColumnIndex(
                          MediaStore.Audio.Media.DISPLAY_NAME);

                      int idIndex = cursor.getColumnIndex(
                          MediaStore.Audio.Media._ID);

                      while (cursor.moveToNext()) {
                          String name = cursor.getString(nameIndex);
                          long id = cursor.getLong(idIndex);

                          Uri uri = Uri.withAppendedPath(
                              MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                              String.valueOf(id));

                          names.add(name);
                          paths.add(uri.toString());
                      }

                      cursor.close();
                  }

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_list_item_1,
                          names);

                  songList.setAdapter(adapter);
              }

              void playSong(int position) {
                  try {
                      if (player != null) {
                          player.release();
                      }

                      player = MediaPlayer.create(
                          this,
                          Uri.parse(paths.get(position)));

                      player.start();

                      nowPlaying.setText("▶ " + names.get(position));

                      player.setOnCompletionListener(mp -> {
                          nowPlaying.setText("গান শেষ হয়েছে");
                      });

                  } catch (Exception e) {
                      nowPlaying.setText("গান চালানো যায়নি");
                  }
              }

              @Override
              protected void onDestroy() {
                  if (player != null) {
                      player.release();
                  }
                  super.onDestroy();
              }
          }
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          export PATH="$PWD/gradle-8.9/bin:$PATH"

          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanMusicPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
