name: Build Gan Music Player APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ganmusicplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GanMusicPlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.ganmusicplayer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ganmusicplayer"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Gan"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#0F1016</color>
              <color name="card_dark">#1B1C24</color>
              <color name="text_white">#FFFFFF</color>
              <color name="text_gray">#9E9EA6</color>
              <color name="accent_purple">#6C5CE7</color>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F1016"
              android:padding="16dp">

              <!-- Top Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingBottom="12dp">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Gan"
                      android:textColor="#FFFFFF"
                      android:textSize="28sp"
                      android:textStyle="bold" />

                  <ImageView
                      android:layout_width="28dp"
                      android:layout_height="28dp"
                      android:src="@android:drawable/ic_menu_search"
                      android:tint="#FFFFFF"
                      android:layout_marginEnd="16dp"/>

                  <ImageView
                      android:layout_width="28dp"
                      android:layout_height="28dp"
                      android:src="@android:drawable/ic_menu_more"
                      android:tint="#FFFFFF"/>
              </LinearLayout>

              <!-- Now Playing Info -->
              <TextView
                  android:id="@+id/nowPlayingText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="কোনো গান সিলেক্ট করা হয়নি"
                  android:textColor="#9E9EA6"
                  android:textSize="14sp"
                  android:gravity="center"
                  android:padding="8dp"/>

              <!-- Playback Controls -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:padding="8dp">

                  <Button
                      android:id="@+id/btnPrev"
                      android:layout_width="60dp"
                      android:layout_height="50dp"
                      android:text="⏮"
                      android:textSize="18sp"
                      android:backgroundTint="#1B1C24"
                      android:textColor="#FFFFFF"/>

                  <Button
                      android:id="@+id/btnPlay"
                      android:layout_width="80dp"
                      android:layout_height="55dp"
                      android:text="▶"
                      android:textSize="20sp"
                      android:layout_marginStart="16dp"
                      android:layout_marginEnd="16dp"
                      android:backgroundTint="#6C5CE7"
                      android:textColor="#FFFFFF"/>

                  <Button
                      android:id="@+id/btnNext"
                      android:layout_width="60dp"
                      android:layout_height="50dp"
                      android:text="⏭"
                      android:textSize="18sp"
                      android:backgroundTint="#1B1C24"
                      android:textColor="#FFFFFF"/>
              </LinearLayout>

              <!-- Song ListView -->
              <ListView
                  android:id="@+id/songListView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:divider="@null"
                  android:dividerHeight="6dp"
                  android:paddingTop="10dp"/>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/ganmusicplayer/MainActivity.java <<'EOF'
          package com.ganmusicplayer;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private ArrayList<String> songNames = new ArrayList<>();
              private ArrayList<Uri> songUris = new ArrayList<>();
              private MediaPlayer player;
              private int currentSongIndex = -1;

              private TextView nowPlayingText;
              private Button btnPlay, btnPrev, btnNext;
              private ListView songListView;

              private static final int PERMISSION_REQ_CODE = 101;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  nowPlayingText = findViewById(R.id.nowPlayingText);
                  btnPlay = findViewById(R.id.btnPlay);
                  btnPrev = findViewById(R.id.btnPrev);
                  btnNext = findViewById(R.id.btnNext);
                  songListView = findViewById(R.id.songListView);

                  checkPermissionAndLoadSongs();

                  btnPlay.setOnClickListener(v -> {
                      if (player != null) {
                          if (player.isPlaying()) {
                              player.pause();
                              btnPlay.setText("▶");
                          } else {
                              player.start();
                              btnPlay.setText("⏸");
                          }
                      } else if (!songUris.isEmpty()) {
                          playSong(0);
                      }
                  });

                  btnNext.setOnClickListener(v -> {
                      if (!songUris.isEmpty()) {
                          currentSongIndex = (currentSongIndex + 1) % songUris.size();
                          playSong(currentSongIndex);
                      }
                  });

                  btnPrev.setOnClickListener(v -> {
                      if (!songUris.isEmpty()) {
                          currentSongIndex = (currentSongIndex - 1 < 0) ? songUris.size() - 1 : currentSongIndex - 1;
                          playSong(currentSongIndex);
                      }
                  });

                  songListView.setOnItemClickListener((parent, view, position, id) -> playSong(position));
              }

              private void checkPermissionAndLoadSongs() {
                  String permission = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) ?
                          Manifest.permission.READ_MEDIA_AUDIO : Manifest.permission.READ_EXTERNAL_STORAGE;

                  if (checkSelfPermission(permission) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{permission}, PERMISSION_REQ_CODE);
                  } else {
                      loadSongs();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQ_CODE && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadSongs();
                  } else {
                      Toast.makeText(this, "মিউজিক পড়ার জন্য পারমিশন প্রয়োজন!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void loadSongs() {
                  songNames.clear();
                  songUris.clear();

                  Uri uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                  String[] projection = {
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.DATA
                  };

                  Cursor cursor = getContentResolver().query(uri, projection, MediaStore.Audio.Media.IS_MUSIC + " != 0", null, null);
                  if (cursor != null) {
                      while (cursor.moveToNext()) {
                          String title = cursor.getString(0);
                          String path = cursor.getString(1);
                          songNames.add(title);
                          songUris.add(Uri.parse(path));
                      }
                      cursor.close();
                  }

                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, songNames) {
                      @Override
                      public View getView(int position, View convertView, android.view.ViewGroup parent) {
                          View view = super.getView(position, convertView, parent);
                          TextView tv = view.findViewById(android.R.id.text1);
                          tv.setTextColor(getResources().getColor(android.R.color.white));
                          return view;
                      }
                  };
                  songListView.setAdapter(adapter);
              }

              private void playSong(int index) {
                  try {
                      if (player != null) {
                          player.stop();
                          player.release();
                          player = null;
                      }

                      currentSongIndex = index;
                      player = MediaPlayer.create(this, songUris.get(index));
                      player.start();

                      btnPlay.setText("⏸");
                      nowPlayingText.setText("চলছে: " + songNames.get(index));

                      player.setOnCompletionListener(mp -> {
                          // অটোমেটিক পরবর্তী গান বাজানো
                          if (currentSongIndex + 1 < songUris.size()) {
                              playSong(currentSongIndex + 1);
                          }
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanMusicPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
